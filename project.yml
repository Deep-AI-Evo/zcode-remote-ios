name: ZCodeRemote
options:
  bundleIdPrefix: com.zcode
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    CODE_SIGN_STYLE: Automatic

targets:
  ZCodeRemote:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zcode.remote.ios
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Z-Code 远程手机工作台
        CFBundleShortVersionString: "1.4.3"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "扫描电脑屏幕上 ZCode 的连接二维码，用于添加远程连接"
        ITSAppUsesNonExemptEncryption: false

  ZCodeRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ZCodeRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zcode.remote.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ZCodeRemote:
    build:
      targets:
        ZCodeRemote: all
        ZCodeRemoteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZCodeRemoteUITests
